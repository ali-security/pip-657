name: tests

on:
  push:
  pull_request:

jobs:
  tests-primary:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    env:
      TOXENV: lint,docs,vendoring

    strategy:
      fail-fast: false
      matrix:
        os:
          - Ubuntu
          - Windows
          - MacOS
        py:
          - "2.7"
          - "3.5"
          - "3.6"
          - "3.7"
          - "3.8"

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: install tox
        run: pip install --upgrade 'virtualenv<20' setuptools tox

      - name: Tox run unit tests
        run: tox -e py -- -m unit -n auto --junit-xml=junit/unit-test.xml

      - name: Tox run Group 0 integration tests
        run: tox -e py -- -m integration -n auto --duration=5 -k "not test_install" --junit-xml=junit/integration-test-group0.xml

      - name: Tox run Group 1 integration tests
        run: tox -e py -- -m integration -n auto --duration=5 -k "test_install" --junit-xml=junit/integration-test-group1.xml
